# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# R8 full mode: release builds use the complete R8 optimizer instead of the
# compatibility-oriented subset. The app has no reflective data binding or
# @Serializable classes (providers parse JsonObject trees directly), and the
# JNI bridge / manifest components are kept explicitly below.
android.enableR8.fullMode=true

# Versioning (overridable from CI: -PversionCode=... -PversionName=...)
versionCode=13
versionName=1.1.11
