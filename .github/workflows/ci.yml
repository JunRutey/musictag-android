name: CI

on:
  push:
    branches: [ "main" ]
    tags-ignore: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The tag engine compiles upstream TagLib for three ABIs.
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
          echo "ndk=$ANDROID_HOME/ndk/27.0.12077973"

      # Fails in seconds on broken XML / missing classes instead of after a full compile.
      - name: Static self-check
        run: python3 tools/selfcheck.py

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      # Assertion text is the fastest way to diagnose a red run; surface it in the log
      # instead of hiding it in an XML artifact the agent has to download.
      - name: Show unit test failures
        if: failure()
        run: |
          find app/build/test-results -name '*.xml' -print0 2>/dev/null \
            | xargs -0 grep -h -B1 -A8 '<failure' 2>/dev/null | head -n 160 || true

      - name: Lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # The JVM tests guard the *source* manifest; this guards the *merged* manifest
      # that actually ships (library manifests are merged in during the build).
      - name: Verify compatibility contract against the built APK
        run: |
          python3 tools/manifest_contract.py \
            --verify-apk app/build/outputs/apk/debug/app-debug.apk \
            --expect docs/MANIFEST_CONTRACT.json

      - name: Show APK facts
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -n 20

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  native:
    name: Native tag engine (host build + real reads)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Same sources the Android build compiles, but for the host JVM so TagLib can be
      # exercised by plain unit tests (no device, no emulator).
      - name: Configure host build of the JNI bridge
        run: cmake -S native/taglib -B build/host -DCMAKE_BUILD_TYPE=Release

      - name: Build host library
        run: cmake --build build/host --parallel

      - name: List produced libraries
        run: ls -l build/host/*.so

      - name: Tag engine tests (real TagLib reads against fixtures)
        env:
          MUSICTAG_HOST_LIB: ${{ github.workspace }}/build/host/libmusictag_jni.so
        run: ./gradlew --no-daemon --stacktrace :core:tag:test

      - name: Upload tag engine test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tag-engine-test-report
          path: |
            core/tag/build/reports/tests/test
            core/tag/build/test-results/test
          if-no-files-found: ignore

