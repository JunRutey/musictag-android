name: Emulator tests

# Manual for now: there are no instrumented tests until M2 (tag editing) lands.
# Once they exist this becomes the gate for the content:// write-back matrix.
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Emulator API level"
        required: false
        default: "34"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  connected:
    name: connectedAndroidTest (API ${{ github.event.inputs.api_level || '34' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [ 30, 34 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected
          if-no-files-found: ignore
