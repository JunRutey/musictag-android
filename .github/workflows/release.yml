name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode override (defaults to the tag-derived value)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derive versions
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="0.0.0-$(git rev-parse --short HEAD)"
          fi
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          if [[ -z "${VERSION_CODE}" ]]; then
            VERSION_CODE=$(date -u +%Y%m%d%H)
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION_NAME} (${VERSION_CODE})"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "MUSICTAG_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed release
        env:
          MUSICTAG_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          MUSICTAG_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          MUSICTAG_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}" \
            assembleRelease

      - name: Verify signature and contract
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          python3 tools/manifest_contract.py --verify-apk "$APK" --expect docs/MANIFEST_CONTRACT.json

      - name: Package artifacts
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp "$APK" "dist/musictag-${{ steps.ver.outputs.name }}.apk"
          cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Compose release notes (Chinese, from CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          python3 - "$VERSION" > dist/NOTES.md <<'PY'
          import pathlib, sys

          version = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          section, collecting = [], False
          for line in changelog:
              if line.startswith("## ["):
                  if collecting:
                      break
                  collecting = line.startswith(f"## [{version}]")
                  continue
              if collecting:
                  section.append(line)

          print("安装说明：本包用项目自有密钥签名，覆盖安装前请先卸载原版")
          print("com.xjcheng.musictageditor 1.2.x（Android 不允许更换签名的应用直接覆盖）。")
          print("音频文件里的标签不受影响；应用设置与日志按安装独立。")
          print()
          print(f"## 版本 {version}")
          print()
          if section:
              print("\n".join(section).strip())
          else:
              print("详见仓库 CHANGELOG.md。")
          PY
          cat dist/NOTES.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: dist/NOTES.md
