name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode override (defaults to the tag-derived value)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derive versions
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="0.0.0-$(git rev-parse --short HEAD)"
          fi
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          if [[ -z "${VERSION_CODE}" ]]; then
            VERSION_CODE=$(date -u +%Y%m%d%H)
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION_NAME} (${VERSION_CODE})"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "MUSICTAG_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed release
        env:
          MUSICTAG_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          MUSICTAG_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          MUSICTAG_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}" \
            assembleRelease

      - name: Verify signature and contract
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          python3 tools/manifest_contract.py --verify-apk "$APK" --expect docs/MANIFEST_CONTRACT.json

      - name: Package artifacts
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp "$APK" "dist/musictag-${{ steps.ver.outputs.name }}.apk"
          cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install note: this build is signed with the project's own key, so the
            original com.xjcheng.musictageditor 1.2.x must be uninstalled first
            (Android refuses to replace an app with a different signature).
            Tags stored inside audio files are unaffected; app settings, bookmarks
            and tag history are per-install and start empty.
